name: Validar MVP local
on:
  pull_request:
    branches: [main, 'codex/**']
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  symlink-safety:
    # Real symlinks without changing Windows privileges. This does not certify NTFS.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run all three previously skipped symlink regressions
        run: >-
          python -m unittest -v
          tests_mvp.test_installer_transaction.InstallerTransactionTests.test_linked_staged_file_is_rejected_without_reading_external_target
          tests_mvp.test_installer_transaction.InstallerTransactionTests.test_linked_stage_root_is_rejected_before_resolving_it
          tests_mvp.test_installer_transaction.InstallerTransactionTests.test_linked_parent_is_rejected_before_resolve_hides_the_alias
  mvp:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-mvp.txt
      - run: python -m unittest discover -s tests_mvp -v
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.0'
      - name: Validate official embedded runtime independently of installed Python
        shell: pwsh
        run: |
          python -m pip install --require-hashes -r requirements-runtime-build.txt
          npm ci --prefix apps/web
          npm run build --prefix apps/web
          python scripts/build_embedded_runtime.py .lumaforge-local/runtime-ci
          python scripts/test_embedded_runtime.py .lumaforge-local/runtime-ci .lumaforge-local/runtime-test-report.json
          python scripts/qa_runtime_isolation.py .lumaforge-local/runtime-ci .lumaforge-local/runtime-isolation-report.json
# Developer runner only: this is not a clean Windows10/11 desktop test.
# No runtime, installer or private image is uploaded by this workflow.

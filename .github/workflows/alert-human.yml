name: Avisar al humano

on:
  issues:
    types: [labeled]
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue de acción existente, con título y siete campos completos
        required: true
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  notify:
    if: >-
      ${{ vars.REVIEWER_GITHUB != '' &&
          ((github.event_name == 'issues' && github.event.label.name == 'needs-human') ||
           (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
           github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    concurrency:
      group: lumaforge-human-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
      cancel-in-progress: false
    steps:
      - name: Mencionar al responsable desde GitHub Actions
        uses: actions/github-script@v7
        env:
          REVIEWER_GITHUB: ${{ vars.REVIEWER_GITHUB }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const reviewer = process.env.REVIEWER_GITHUB || '';
            if (!/^[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,37}[a-zA-Z0-9])?$/.test(reviewer)) {
              core.setFailed('REVIEWER_GITHUB no válido');
              return;
            }
            const {owner, repo} = context.repo;
            const fields = ['Qué has terminado', 'Qué necesitas de mí', 'Por qué necesitas mi intervención',
              'Opciones disponibles', 'Tu recomendación', 'Cómo responder', 'Enlace'];
            const prefix = '[LUMAFORGE] ACCIÓN REQUERIDA — ';
            let issue = context.issue.number;
            let actionIssue = context.payload.issue;
            if (context.eventName === 'workflow_dispatch') {
              const raw = String(context.payload.inputs?.issue_number || '');
              if (!/^[1-9]\d*$/.test(raw) || !Number.isSafeInteger(Number(raw))) {
                core.setFailed('issue_number debe ser un entero positivo');
                return;
              }
              const response = await github.rest.issues.get({owner, repo, issue_number: Number(raw)});
              actionIssue = response.data;
              if (actionIssue.pull_request) { core.setFailed('La acción debe dirigirse a una Issue, no a una PR'); return; }
              issue = actionIssue.number;
            }
            let request;
            let noticeMarker;
            if (context.eventName === 'pull_request') {
              const pr = context.payload.pull_request;
              const task = (pr.title || '').match(/\[COL-\d{3}\]/)?.[0];
              if (!task || pr.draft) { core.info('PR sin tarea revisable: omitida'); return; }
              const marker = `<!-- lumaforge-review-pr:${issue} -->`;
              const requests = await github.paginate(github.rest.issues.listForRepo, {
                owner, repo, state: 'all', per_page: 100
              });
              if (requests.some(item => !item.pull_request && (item.body || '').includes(marker))) {
                core.info('Solicitud existente: no duplicar ni volver a notificar el mismo bloqueo.');
                return;
              }
              const link = `https://github.com/${owner}/${repo}/pull/${pr.number}`;
              const values = [
                `${task} tiene una entrega preparada para revisión en PR #${pr.number}; el alcance y las pruebas están en su descripción.`,
                `Revisar ${task}, sus criterios de aceptación y las evidencias; aceptar el alcance documentado o pedir cambios concretos.`,
                'La aceptación de producto corresponde al usuario. Una PR integrada o un check correcto no aprueban una tarea ni autorizan P1.',
                'Aceptar únicamente el alcance revisado, o responder con correcciones y mantener la tarea pendiente. Si faltan evidencias, no aprobarla.',
                'Contrastar diff, criterios y pruebas antes de decidir; mantener pendientes entrevistas, permisos y experimentos que no se hayan realizado.',
                `Responder en esta Issue «ACEPTAR DOCUMENTACIÓN ${task} PR #${pr.number}» o «CAMBIOS: ...». Indicar por separado si se acepta la tarea completa. El agente no hace merge ni aplica approved.`,
                `${link}\n\nChecks: ${link}/checks`
              ];
              request = marker + '\n\n' + fields.map((field, index) => `## ${field}\n${values[index]}`).join('\n\n');
              const created = await github.rest.issues.create({owner, repo,
                title: `${prefix}Revisar ${task} PR #${pr.number}`, body: request});
              issue = created.data.number;
              await github.rest.issues.addLabels({owner, repo, issue_number: issue, labels: ['needs-human']});
              noticeMarker = `<!-- lumaforge-notified-pr:${pr.number} -->`;
            } else if (context.eventName === 'issues' || context.eventName === 'workflow_dispatch') {
              const item = actionIssue;
              request = (item.body || '').replace(/\r\n/g, '\n');
              const incomplete = fields.some(field => {
                const heading = `## ${field}\n`;
                const at = request.indexOf(heading);
                return at < 0 || !request.slice(at + heading.length).split(/\n## /)[0].trim();
              });
              if (!(item.title || '').startsWith(prefix) || incomplete) {
                core.setFailed('La solicitud needs-human debe tener el título y los siete campos de acción requeridos.');
                return;
              }
              const digest = require('crypto').createHash('sha256').update(request).digest('hex').slice(0, 16);
              noticeMarker = `<!-- lumaforge-notified-issue:${issue}:${digest} -->`;
              const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number: issue, per_page: 100});
              if (comments.some(comment => (comment.body || '').includes(noticeMarker))) {
                core.info('Esta solicitud ya fue notificada: no repetir el aviso.');
                return;
              }
            } else return;
            await github.rest.issues.createComment({owner, repo, issue_number: issue,
              body: `${noticeMarker}\n🔔 @${reviewer}\n\n${request}\n\nEl aviso no constituye aprobación. Solo se detiene el trabajo dependiente; continúan tareas independientes autorizadas.`});

name: Publicar roadmap

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/sync_github.py'
      - '.github/workflows/publish-roadmap.yml'
      - 'tests/**'
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]
  pull_request:
    types: [opened, reopened, ready_for_review, closed]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: roadmap-pages
  cancel-in-progress: false

jobs:
  publish:
    # Para PR externas, la publicación se recupera por la sincronización programada.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout de la rama principal
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Comprobar reglas de aprobación
        run: python -m unittest discover -s tests -v
      - name: Sincronizar Issues y Pull Requests
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/sync_github.py
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Empaquetar web
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Desplegar sitio
        uses: actions/deploy-pages@v4
        id: deployment

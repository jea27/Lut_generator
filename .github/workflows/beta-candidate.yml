name: Compilar candidato beta Windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.0'
      - name: Use the recorded Rust compiler when the runner differs
        shell: pwsh
        run: |
          if ((rustc --version) -notlike 'rustc 1.99.1 *') {
            rustup toolchain install 1.99.1 --profile minimal
            rustup default 1.99.1
          }
      - run: |
          python -m venv .venv-mvp
          ./.venv-mvp/Scripts/python.exe -m pip install -r requirements-mvp.txt
          ./.venv-mvp/Scripts/python.exe -m pip install --require-hashes -r requirements-runtime-build.txt
          npm ci --prefix apps/web
      - run: ./scripts/build_beta.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: color-studio-windows-candidate
          path: |
            .lumaforge-local/beta-artifact.json
            .lumaforge-local/beta-payload-audit.json
            .lumaforge-local/runtime-signatures.json
            .lumaforge-local/beta-nsis-audit.json
          retention-days: 7
# Sanitized audit reports only. No installer upload from this public repository.
# No release, signing credentials, token generation, deployment or auto-approval.
